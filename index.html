<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demonstração FolEs na Web com LMHT</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      height: 100vh;
      overflow: hidden;
    }
    
    .container {
      display: flex;
      height: 100vh;
    }
    
    .left-panel {
      width: 50%;
      border-right: 2px solid #ddd;
      display: flex;
      flex-direction: column;
    }
    
    .right-panel {
      width: 50%;
      display: flex;
      flex-direction: column;
    }
    
    .panel-header {
      background: #2d2d30;
      color: #fff;
      padding: 10px 15px;
      font-size: 14px;
      font-weight: 500;
    }
    
    #editor {
      flex: 1;
    }
    
    .preview-section {
      flex: 1;
      border-bottom: 2px solid #ddd;
      display: flex;
      flex-direction: column;
    }
    
    .template-section {
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    
    #preview {
      flex: 1;
      background: white;
      border: none;
    }
    
    #lmhtEditor {
      flex: 1;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="left-panel">
      <div class="panel-header">Editor FolEs</div>
      <div id="editor"></div>
    </div>
    
    <div class="right-panel">
      <div class="preview-section">
        <div class="panel-header">Prévia</div>
        <iframe id="preview"></iframe>
      </div>
      
      <div class="template-section">
        <div class="panel-header">Editor LMHT</div>
        <div id="lmhtEditor"></div>
      </div>
    </div>
  </div>

  <script src="foles.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/loader.min.js"></script>
  <script>
    require.config({ paths: { vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs' }});
    
    const templateLMHT = `<lmht>
  <cabeça>
    <título>Meu Site</título>
  </cabeça>
  <corpo>
    <cabeçalho classe="cabecalho">
      <título1 classe="titulo">Meu Site</título1>
      <navegação classe="navegacao">
        <ligação destino="#" classe="link-nav">Início</ligação>
        <ligação destino="#" classe="link-nav">Sobre</ligação>
        <ligação destino="#" classe="link-nav">Contato</ligação>
      </navegação>
    </cabeçalho>

    <principal classe="conteudo-principal">
      <seção classe="cartao">
        <título2 classe="titulo-cartao">Bem-vindo</título2>
        <p classe="texto-cartao">Este é um template com classes predefinidas.</p>
        <botão classe="btn">Clique Aqui</botão>
      </seção>
    </principal>

    <rodapé classe="rodape">
      <p classe="texto-rodape">© 2026 Meu Site</p>
    </rodapé>
  </corpo>
</lmht>`;

    const initialFolEs = `/* Estilos FolEs - Linguagem de Folhas de Estilo em Português */

lmht {
  tamanho-fonte: 16px;
}

corpo {
  margem: 0;
  recuo: 20px;
  fundo: #f5f5f5;
  fonte-texto: Arial, sem-serifa;
}

.cabecalho {
  fundo: gradiente-linear(135deg, #667eea 0%, #764ba2 100%);
  cor: branco;
  recuo: 30px;
  raio-borda: 10px;
  margem-inferior: 20px;
}

.titulo {
  margem: 0 0 15px 0;
  tamanho-fonte: 2.5em;
}

.navegacao {
  exibição: flex;
  espaçamento: 20px;
}

.link-nav {
  cor: branco;
  decoração-texto: nenhuma;
  espessura-fonte: em-negrito;
  transição: opacidade 0.3s;
}

.link-nav:sobre {
  opacidade: 0.8;
}

.conteudo-principal {
  margem: 20px 0;
}

.cartao {
  fundo: branco;
  borda: 2px sólido #e0e0e0;
  raio-borda: 10px;
  recuo: 30px;
  sombra-caixa: 0 4px 6px #0000001a;
}

.titulo-cartao {
  cor: #667eea;
  margem-inferior: 15px;
}

.texto-cartao {
  cor: #666;
  margem-inferior: 20px;
  altura-linha: 1.6;
}

.btn {
  fundo: #667eea;
  cor: branco;
  borda: nenhum;
  recuo: 12px 30px;
  raio-borda: 5px;
  cursor: indicador;
  tamanho-fonte: 16px;
  transição: fundo 0.3s;
}

.btn:sobre {
  fundo: #5568d3;
}

.rodape {
  fundo: #333;
  cor: branco;
  recuo: 20px;
  raio-borda: 10px;
  alinhar-texto: centro;
  margem-superior: 20px;
}

.texto-rodape {
  margem: 0;
}`;

    require(['vs/editor/editor.main'], function() {
      monaco.languages.register({ id: 'foles' });
      
      // Definir realce de sintaxe para FolEs
      monaco.languages.setMonarchTokensProvider('foles', {
        tokenizer: {
          root: [
            [/\/\*/, 'comment', '@comment'],
            [/\/\/.*$/, 'comment'],
            [/@[\w-]+/, 'keyword'],
            [/#[0-9a-fA-F]{3,8}\b/, 'number.hex'],
            [/#[a-zA-ZÀ-ÿ][\w-]*/, 'tag.id'],
            [/\.[a-zA-ZÀ-ÿ][\w-]*/, 'tag.class'],
            [/[\w-]+(?=\s*:)/, 'attribute.name'],
            [/[a-zçãõáéíóúâêîôûàèìòùäëïöüA-ZÇÃÕÁÉÍÓÚÂÊÎÔÛÀÈÌÒÙÄËÏÖÜ]+/, 'tag'],
            [/:/, 'delimiter'],
            [/;/, 'delimiter'],
            [/\{/, 'delimiter.bracket', '@block'],
            [/\}/, 'delimiter.bracket'],
            [/[0-9]+\.?[0-9]*(px|em|rem|%|pt|cm|mm|in|pc|ex|ch|vw|vh|vmin|vmax|deg|rad|grad|turn|s|ms)\b/, 'number'],
            [/[0-9]+\.?[0-9]*/, 'number'],
            [/"([^"\\]|\\.)*$/, 'string.invalid'],
            [/"/, 'string', '@string_double'],
            [/'([^'\\]|\\.)*$/, 'string.invalid'],
            [/'/, 'string', '@string_single'],
          ],
          comment: [
            [/\*\//, 'comment', '@pop'],
            [/./, 'comment']
          ],
          block: [
            [/\}/, 'delimiter.bracket', '@pop'],
            { include: '@root' }
          ],
          string_double: [
            [/[^\\"]+/, 'string'],
            [/"/, 'string', '@pop']
          ],
          string_single: [
            [/[^\\']+/, 'string'],
            [/'/, 'string', '@pop']
          ]
        }
      });
      
      // Definir configuração da linguagem FolEs
      monaco.languages.setLanguageConfiguration('foles', {
        comments: {
          lineComment: '//',
          blockComment: ['/*', '*/']
        },
        brackets: [
          ['{', '}'],
          ['[', ']'],
          ['(', ')']
        ],
        autoClosingPairs: [
          { open: '{', close: '}' },
          { open: '[', close: ']' },
          { open: '(', close: ')' },
          { open: '"', close: '"' },
          { open: "'", close: "'" }
        ],
        surroundingPairs: [
          { open: '{', close: '}' },
          { open: '[', close: ']' },
          { open: '(', close: ')' },
          { open: '"', close: '"' },
          { open: "'", close: "'" }
        ]
      });

      // Add color provider for FolEs
      monaco.languages.registerColorProvider('foles', {
        provideDocumentColors(model) {
          const colors = [];
          const text = model.getValue();
          
          // Match hex colors (#fff, #ffffff)
          const hexRegex = /#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})\b/g;
          let match;
          while ((match = hexRegex.exec(text)) !== null) {
            const hex = match[1];
            const fullHex = hex.length === 3 
              ? hex.split('').map(c => c + c).join('')
              : hex;
            
            const r = parseInt(fullHex.substr(0, 2), 16) / 255;
            const g = parseInt(fullHex.substr(2, 2), 16) / 255;
            const b = parseInt(fullHex.substr(4, 2), 16) / 255;
            
            colors.push({
              color: { red: r, green: g, blue: b, alpha: 1 },
              range: {
                startLineNumber: model.getPositionAt(match.index).lineNumber,
                startColumn: model.getPositionAt(match.index).column,
                endLineNumber: model.getPositionAt(match.index + match[0].length).lineNumber,
                endColumn: model.getPositionAt(match.index + match[0].length).column
              }
            });
          }
          
          // Match rgb/rgba colors
          const rgbRegex = /rgba?\s*\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)\s*(?:,\s*([\d.]+)\s*)?\)/g;
          while ((match = rgbRegex.exec(text)) !== null) {
            const r = parseInt(match[1]) / 255;
            const g = parseInt(match[2]) / 255;
            const b = parseInt(match[3]) / 255;
            const a = match[4] ? parseFloat(match[4]) : 1;
            
            colors.push({
              color: { red: r, green: g, blue: b, alpha: a },
              range: {
                startLineNumber: model.getPositionAt(match.index).lineNumber,
                startColumn: model.getPositionAt(match.index).column,
                endLineNumber: model.getPositionAt(match.index + match[0].length).lineNumber,
                endColumn: model.getPositionAt(match.index + match[0].length).column
              }
            });
          }
          
          return colors;
        },
        
        provideColorPresentations(model, colorInfo) {
          const color = colorInfo.color;
          const r = Math.round(color.red * 255);
          const g = Math.round(color.green * 255);
          const b = Math.round(color.blue * 255);
          const a = color.alpha;
          
          const toHex = (n) => {
            const hex = n.toString(16);
            return hex.length === 1 ? '0' + hex : hex;
          };
          
          const presentations = [
            {
              label: `#${toHex(r)}${toHex(g)}${toHex(b)}`
            }
          ];
          
          if (a < 1) {
            presentations.push({
              label: `rgba(${r}, ${g}, ${b}, ${a.toFixed(2)})`
            });
          } else {
            presentations.push({
              label: `rgb(${r}, ${g}, ${b})`
            });
          }
          
          return presentations;
        }
      });

      const folesEditor = monaco.editor.create(document.getElementById('editor'), {
        value: initialFolEs,
        language: 'foles',
        theme: 'vs-dark',
        automaticLayout: true,
        fontSize: 14,
        minimap: { enabled: false },
        unicodeHighlight: {
          ambiguousCharacters: false,
          invisibleCharacters: false
        }
      });

      // Definir realce de sintaxe para LMHT
      monaco.languages.register({ id: 'lmht' });

      monaco.languages.setMonarchTokensProvider('lmht', {
        tokenizer: {
          root: [
            [/<!-[-]/, 'comment', '@comment'],
            [/<!\[CDATA\[/, 'string', '@cdata'],
            [/(<\/?)([a-zA-ZÀ-ÿ][a-zA-ZÀ-ÿ0-9_-]*)/, [
              { token: 'delimiter' },
              { token: 'tag', next: '@tag' }
            ]],
            [/[^<]+/, ''],
          ],
          comment: [
            [/--[>]/, 'comment', '@pop'],
            [/[^-]+/, 'comment'],
            [/./, 'comment'],
          ],
          cdata: [
            [/\]\][>]/, 'string', '@pop'],
            [/[^\]]+/, 'string'],
            [/./, 'string'],
          ],
          tag: [
            [/\s+/, ''],
            [/\/?>/, 'delimiter', '@pop'],
            [/[a-zA-ZÀ-ÿ][a-zA-ZÀ-ÿ0-9_:-]*/, 'attribute.name'],
            [/=/, 'delimiter'],
            [/"[^"]*"/, 'string'],
            [/'[^']*'/, 'string'],
          ],
        }
      });

      monaco.languages.setLanguageConfiguration('lmht', {
        comments: {
          blockComment: ['<!--', '--' + '>']
        },
        brackets: [
          ['<', '>'],
          ['{', '}'],
          ['[', ']'],
          ['(', ')']
        ],
        autoClosingPairs: [
          { open: '<', close: '>' },
          { open: '"', close: '"' },
          { open: "'", close: "'" }
        ],
        surroundingPairs: [
          { open: '<', close: '>' },
          { open: '"', close: '"' },
          { open: "'", close: "'" }
        ]
      });

      const lmhtEditor = monaco.editor.create(document.getElementById('lmhtEditor'), {
        value: templateLMHT,
        language: 'lmht',
        theme: 'vs-dark',
        automaticLayout: true,
        fontSize: 14,
        minimap: { enabled: false },
        unicodeHighlight: {
          ambiguousCharacters: false,
          invisibleCharacters: false
        }
      });

      function atualizarPrevia() {
        const foles = folesEditor.getValue();
        const lmht = lmhtEditor.getValue();

        const resultadoFoles = analisarFoles(foles);
        const errosMarkers = resultadoFoles.erros.map(function(erro) {
          const linha = (erro.simbolo && erro.simbolo.linha) || 1;
          const colunaInicial = (erro.simbolo && erro.simbolo.colunaInicial) || 1;
          const colunaFinal = (erro.simbolo && erro.simbolo.colunaFinal) || 1000;
          return {
            startLineNumber: linha,
            startColumn: colunaInicial,
            endLineNumber: linha,
            endColumn: colunaFinal,
            message: erro.message || erro.mensagem,
            severity: 8 // MarkerSeverity.Error
          };
        });
        monaco.editor.setModelMarkers(folesEditor.getModel(), 'foles', errosMarkers);

        if (resultadoFoles.css === null) return;
        const css = resultadoFoles.css;
        const html = lmhtParaHTML(lmht);
        
        const fullHTML = `
          <!DOCTYPE html>
          <html>
          <head>
            <style>
              ${css}
            </style>
          </head>
          ${html.replace('<html>', '').replace('</html>', '')}
          </html>
        `;
        
        const iframe = document.getElementById('preview');
        iframe.srcdoc = fullHTML;
      }

      folesEditor.onDidChangeModelContent(() => {
        atualizarPrevia();
      });

      lmhtEditor.onDidChangeModelContent(() => {
        atualizarPrevia();
      });

      atualizarPrevia();
    });
  </script>
</body>
</html>
