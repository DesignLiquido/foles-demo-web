<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demonstração FolEs na Web com LMHT</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      height: 100vh;
      overflow: hidden;
    }
    
    .container {
      display: flex;
      height: 100vh;
    }
    
    .left-panel {
      width: 50%;
      border-right: 2px solid #ddd;
      display: flex;
      flex-direction: column;
    }
    
    .right-panel {
      width: 50%;
      display: flex;
      flex-direction: column;
    }
    
    .panel-header {
      background: #2d2d30;
      color: #fff;
      padding: 10px 15px;
      font-size: 14px;
      font-weight: 500;
    }
    
    #editor {
      flex: 1;
    }
    
    .preview-section {
      flex: 1;
      border-bottom: 2px solid #ddd;
      display: flex;
      flex-direction: column;
    }
    
    .template-section {
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    
    #preview {
      flex: 1;
      background: white;
      border: none;
    }
    
    #lmhtEditor {
      flex: 1;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="left-panel">
      <div class="panel-header">Editor FolEs</div>
      <div id="editor"></div>
    </div>
    
    <div class="right-panel">
      <div class="preview-section">
        <div class="panel-header">Prévia</div>
        <iframe id="preview"></iframe>
      </div>
      
      <div class="template-section">
        <div class="panel-header">Editor LMHT</div>
        <div id="lmhtEditor"></div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/loader.min.js"></script>
  <script>
    require.config({ paths: { vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs' }});
    
    const templateLMHT = `<lmht>
  <cabeça>
    <titulo>Meu Site</titulo>
  </cabeça>
  <corpo>
    <cabeçalho classe="cabecalho">
      <titulo1 classe="titulo">Meu Site</titulo1>
      <navegação classe="navegacao">
        <ligacao destino="#" classe="link-nav">Início</ligacao>
        <ligacao destino="#" classe="link-nav">Sobre</ligacao>
        <ligacao destino="#" classe="link-nav">Contato</ligacao>
      </navegação>
    </cabeçalho>
    
    <principal classe="conteudo-principal">
      <seção classe="cartao">
        <titulo2 classe="titulo-cartao">Bem-vindo</titulo2>
        <p classe="texto-cartao">Este é um template com classes predefinidas.</p>
        <botao classe="btn">Clique Aqui</botao>
      </seção>
    </principal>
    
    <rodape classe="rodape">
      <p classe="texto-rodape">© 2024 Meu Site</p>
    </rodape>
  </corpo>
</lmht>`;

    const initialFolEs = `/* Estilos FolEs - Linguagem de Folhas de Estilo em Português */

lmht {
  tamanho-fonte: 16px;
}

corpo {
  margem: 0;
  preenchimento: 20px;
  fundo: #f5f5f5;
  familia-fonte: Arial, sans-serif;
}

.cabecalho {
  fundo: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  cor: white;
  preenchimento: 30px;
  borda-arredondamento: 10px;
  margem-inferior: 20px;
}

.titulo {
  margem: 0 0 15px 0;
  tamanho-fonte: 2.5em;
}

.navegacao {
  exibição: flex;
  espaçamento: 20px;
}

.link-nav {
  cor: white;
  decoração-texto: nenhum;
  peso-fonte: negrito;
  transição: opacidade 0.3s;
}

.link-nav:hover {
  opacidade: 0.8;
}

.conteudo-principal {
  margem: 20px 0;
}

.cartao {
  fundo: white;
  borda: 2px solid #e0e0e0;
  borda-arredondamento: 10px;
  preenchimento: 30px;
  sombra-caixa: 0 4px 6px rgba(0,0,0,0.1);
}

.titulo-cartao {
  cor: #667eea;
  margem-inferior: 15px;
}

.texto-cartao {
  cor: #666;
  margem-inferior: 20px;
  altura-linha: 1.6;
}

.btn {
  fundo: #667eea;
  cor: white;
  borda: nenhum;
  preenchimento: 12px 30px;
  borda-arredondamento: 5px;
  cursor: ponteiro;
  tamanho-fonte: 16px;
  transição: fundo 0.3s;
}

.btn:hover {
  fundo: #5568d3;
}

.rodape {
  fundo: #333;
  cor: white;
  preenchimento: 20px;
  borda-arredondamento: 10px;
  alinhamento-texto: centro;
  margem-superior: 20px;
}

.texto-rodape {
  margem: 0;
}`;

    // FolEs to CSS translator (simplified version)
    function folesParaCSS(foles) {
      const traducoes = {
        // Propriedades
        'tamanho-fonte': 'font-size',
        'margem': 'margin',
        'preenchimento': 'padding',
        'fundo': 'background',
        'cor': 'color',
        'borda': 'border',
        'borda-arredondamento': 'border-radius',
        'margem-inferior': 'margin-bottom',
        'margem-superior': 'margin-top',
        'familia-fonte': 'font-family',
        'exibição': 'display',
        'espaçamento': 'gap',
        'decoração-texto': 'text-decoration',
        'peso-fonte': 'font-weight',
        'transição': 'transition',
        'opacidade': 'opacity',
        'sombra-caixa': 'box-shadow',
        'altura-linha': 'line-height',
        'cursor': 'cursor',
        'alinhamento-texto': 'text-align',
        
        // Valores
        'nenhum': 'none',
        'negrito': 'bold',
        'ponteiro': 'pointer',
        'centro': 'center',
        
        // Tags
        'lmht': 'html',
        'corpo': 'body',
        'cabeçalho': 'header',
        'navegação': 'nav',
        'ligacao': 'a',
        'principal': 'main',
        'seção': 'section',
        'botao': 'button',
        'rodape': 'footer'
      };
      
      let css = foles;
      for (const [pt, en] of Object.entries(traducoes)) {
        const regex = new RegExp('\\b' + pt + '\\b', 'g');
        css = css.replace(regex, en);
      }
      
      return css;
    }

    // LMHT to HTML translator (simplified version)
    function lmhtParaHTML(lmht) {
      const traducoes = {
        '<lmht>': '<html>',
        '</lmht>': '</html>',
        '<cabeça>': '<head>',
        '</cabeça>': '</head>',
        '<corpo>': '<body>',
        '</corpo>': '</body>',
        '<cabeçalho': '<header',
        '</cabeçalho>': '</header>',
        '<titulo>': '<title>',
        '</titulo>': '</title>',
        '<titulo1': '<h1',
        '</titulo1>': '</h1>',
        '<titulo2': '<h2',
        '</titulo2>': '</h2>',
        '<navegação': '<nav',
        '</navegação>': '</nav>',
        '<ligacao': '<a',
        '</ligacao>': '</a>',
        '<principal': '<main',
        '</principal>': '</main>',
        '<seção': '<section',
        '</seção>': '</section>',
        '<botao': '<button',
        '</botao>': '</button>',
        '<rodape': '<footer',
        '</rodape>': '</footer>',
        'classe=': 'class=',
        'destino=': 'href='
      };
      
      let html = lmht;
      for (const [pt, en] of Object.entries(traducoes)) {
        html = html.split(pt).join(en);
      }
      
      return html;
    }

    require(['vs/editor/editor.main'], function() {
      // Register FolEs language
      monaco.languages.register({ id: 'foles' });
      
      // Define FolEs syntax highlighting
      monaco.languages.setMonarchTokensProvider('foles', {
        tokenizer: {
          root: [
            [/\/\*/, 'comment', '@comment'],
            [/\/\/.*$/, 'comment'],
            [/@[\w-]+/, 'keyword'],
            [/#[a-zA-Z][\w-]*/, 'tag.id'],
            [/\.[a-zA-Z][\w-]*/, 'tag.class'],
            [/[a-zç]+/, 'tag'],
            [/[\w-]+(?=\s*:)/, 'attribute.name'],
            [/:/, 'delimiter'],
            [/;/, 'delimiter'],
            [/\{/, 'delimiter.bracket', '@block'],
            [/\}/, 'delimiter.bracket'],
            [/#[0-9a-fA-F]{3,6}\b/, 'number.hex'],
            [/[0-9]+\.?[0-9]*/, 'number'],
            [/(px|em|rem|%|pt|cm|mm|in|pc|ex|ch|vw|vh|vmin|vmax|deg|rad|grad|turn|s|ms)/, 'keyword.unit'],
            [/"([^"\\]|\\.)*$/, 'string.invalid'],
            [/"/, 'string', '@string_double'],
            [/'([^'\\]|\\.)*$/, 'string.invalid'],
            [/'/, 'string', '@string_single'],
          ],
          comment: [
            [/\*\//, 'comment', '@pop'],
            [/./, 'comment']
          ],
          block: [
            [/\}/, 'delimiter.bracket', '@pop'],
            { include: '@root' }
          ],
          string_double: [
            [/[^\\"]+/, 'string'],
            [/"/, 'string', '@pop']
          ],
          string_single: [
            [/[^\\']+/, 'string'],
            [/'/, 'string', '@pop']
          ]
        }
      });
      
      // Define FolEs language configuration
      monaco.languages.setLanguageConfiguration('foles', {
        comments: {
          lineComment: '//',
          blockComment: ['/*', '*/']
        },
        brackets: [
          ['{', '}'],
          ['[', ']'],
          ['(', ')']
        ],
        autoClosingPairs: [
          { open: '{', close: '}' },
          { open: '[', close: ']' },
          { open: '(', close: ')' },
          { open: '"', close: '"' },
          { open: "'", close: "'" }
        ],
        surroundingPairs: [
          { open: '{', close: '}' },
          { open: '[', close: ']' },
          { open: '(', close: ')' },
          { open: '"', close: '"' },
          { open: "'", close: "'" }
        ]
      });

      const folesEditor = monaco.editor.create(document.getElementById('editor'), {
        value: initialFolEs,
        language: 'foles',
        theme: 'vs-dark',
        automaticLayout: true,
        fontSize: 14,
        minimap: { enabled: false }
      });

      const lmhtEditor = monaco.editor.create(document.getElementById('lmhtEditor'), {
        value: templateLMHT,
        language: 'xml',
        theme: 'vs-dark',
        automaticLayout: true,
        fontSize: 14,
        minimap: { enabled: false }
      });

      function updatePreview() {
        const foles = folesEditor.getValue();
        const lmht = lmhtEditor.getValue();
        const css = folesParaCSS(foles);
        const html = lmhtParaHTML(lmht);
        
        const fullHTML = `
          <!DOCTYPE html>
          <html>
          <head>
            <style>
              ${css}
            </style>
          </head>
          ${html.replace('<html>', '').replace('</html>', '')}
          </html>
        `;
        
        const iframe = document.getElementById('preview');
        iframe.srcdoc = fullHTML;
      }

      folesEditor.onDidChangeModelContent(() => {
        updatePreview();
      });

      lmhtEditor.onDidChangeModelContent(() => {
        updatePreview();
      });

      updatePreview();
    });
  </script>
</body>
</html>
